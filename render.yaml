services:
  - type: web
    name: lynq-demo-api
    branch: deploy/adviser-demo-2026-11-02
    runtime: node
    rootDir: ps-sb/api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_APP_URL
        value: https://lynq-demo-web.onrender.com
      - key: CROWD_THRESHOLD
        value: "8"
      - key: LYNQ_BACKUP_TIME
        value: "20:30"
      - key: LYNQ_BACKUP_TIME_ZONE
        value: Asia/Manila

  - type: static
    name: lynq-demo-web
    branch: deploy/adviser-demo-2026-11-02
    rootDir: ql-cf
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        value: https://lynq-demo-api.onrender.com
      - key: VITE_PUBLIC_QUEUE_URL
        value: https://lynq-demo-web.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
